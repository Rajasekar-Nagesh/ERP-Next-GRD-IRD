; All bench processes for a single-container Railway deployment.
; This is a complete, standalone supervisord config (the container runs as the
; unprivileged frappe user, so nothing is written under /var/run or /var/log).
; Logs go to the container's stdout/stderr so they show up in Railway's log view.

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:nginx]
command=/usr/local/bin/railway-nginx.sh
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gunicorn]
command=/usr/local/bin/start.sh
directory=/home/frappe/frappe-bench
priority=20
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:socketio]
command=node /home/frappe/frappe-bench/apps/frappe/socketio.js
directory=/home/frappe/frappe-bench
environment=PATH="/home/frappe/.nvm/current/bin:/usr/local/bin:/usr/bin:/bin"
priority=20
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker-short]
command=/usr/local/bin/bench worker --queue short,default
directory=/home/frappe/frappe-bench
priority=30
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker-long]
command=/usr/local/bin/bench worker --queue long,default,short
directory=/home/frappe/frappe-bench
priority=30
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/usr/local/bin/bench schedule
directory=/home/frappe/frappe-bench
priority=30
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[group:frappe]
programs=nginx,gunicorn,socketio,worker-short,worker-long,scheduler
